on:
  push:
    branches:
      - main
  workflow_dispatch:
name: Build and deploy to Cloudflare Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Runs before the build, so a failure here stops the deploy entirely.
      # Local hooks can be skipped with --no-verify; this one cannot.
      - name: refuse placeholder assets
        run: |
          if git ls-files | grep -q '__PLACEHOLDER__'; then
            echo "::error::Placeholder artwork is tracked in the repository."
            git ls-files | grep '__PLACEHOLDER__'
            exit 1
          fi
          if git grep -lI '__PLACEHOLDER__' -- ':!.github' ':!.gitignore' ':!docs' > /dev/null 2>&1; then
            echo "::error::Source files still reference placeholder artwork."
            git grep -lI '__PLACEHOLDER__' -- ':!.github' ':!.gitignore' ':!docs'
            exit 1
          fi
          echo "No placeholder artwork found."

      - name: install minify
        run: sudo apt-get update && sudo apt-get install minify

      - name: build with zola
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          BUILD_ONLY: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: fix permissions
        run: sudo chmod -R a+w public/

      - name: minify assets
        run: minify -r -o public/ public/

      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 794762b6bf020a438953ca7ccdbb8e8f
          command: pages deploy public --project-name=dynamotivation-com --branch=main
