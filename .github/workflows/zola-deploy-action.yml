on:
  push:
    branches:
      - main
  workflow_dispatch:
name: Build and deploy to Cloudflare Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install minify
        run: sudo apt-get update && sudo apt-get install minify

      - name: build with zola
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          BUILD_ONLY: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: fix permissions
        run: sudo chmod -R a+w public/

      - name: minify assets
        run: minify -r -o public/ public/

      - name: deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 794762b6bf020a438953ca7ccdbb8e8f
          command: pages deploy public --project-name=dynamotivation-com --branch=main
