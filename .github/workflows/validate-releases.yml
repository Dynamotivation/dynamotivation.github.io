name: Validate release data
on:
  pull_request:
    paths:
      - data/releases.json
      - scripts/validate_releases.py
      - content/portfolio/software/**
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate data/releases.json
        run: python3 scripts/validate_releases.py
